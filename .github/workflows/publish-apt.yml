name: Build & Publish APT (klr-freerdp)

on:
  push:
    branches: [master]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Link debian packaging
        run: ln -s packaging/deb/klr-freerdp debian

      - name: Set package version
        id: ver
        run: |
          version="4.0.0~git$(date +%Y%m%d).${GITHUB_SHA::7}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          dch --package klr-freerdp --newversion "$version" --distribution unstable --urgency low "Automated build from commit $GITHUB_SHA"

      - name: Install build dependencies
        run: |
          sudo apt-get update -q -y
          sudo apt-get install -q -y devscripts equivs
          sudo mk-build-deps --install --tool="apt-get -o Debug::pkgProblemResolver=yes --no-install-recommends -y" debian/control

      - name: Build package
        run: dpkg-buildpackage -us -uc -b

      - name: Move artifacts
        run: |
          mkdir -p artifacts
          mv ../klr-freerdp*.deb artifacts/

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: klr-freerdp-deb
          path: artifacts/*.deb

  release-and-apt:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate release tag
        id: tag
        run: echo "tag=build-$(date +'%Y%m%d')-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Build ${{ steps.tag.outputs.tag }}
          body: |
            Automated build from commit ${{ github.sha }}

            **Install via APT (recommended):**
            ```bash
            curl -fsSL https://kilurion.github.io/klr.FreeRDP/gpg.key | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/klr-freerdp.gpg
            echo "deb [signed-by=/usr/share/keyrings/klr-freerdp.gpg] https://kilurion.github.io/klr.FreeRDP stable main" | sudo tee /etc/apt/sources.list.d/klr-freerdp.list
            sudo apt update
            sudo apt install klr-freerdp
            ```
          files: artifacts/*
          make_latest: true

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Build APT repository
        run: |
          mkdir -p apt-repo/pool/main
          mkdir -p apt-repo/dists/stable/main/binary-amd64

          cp artifacts/*.deb apt-repo/pool/main/

          cd apt-repo
          dpkg-scanpackages pool/main /dev/null > dists/stable/main/binary-amd64/Packages
          gzip -k dists/stable/main/binary-amd64/Packages

          cd dists/stable
          printf '%s\n' \
            "Origin: klr-freerdp" \
            "Label: KLR FreeRDP" \
            "Suite: stable" \
            "Codename: stable" \
            "Architectures: amd64" \
            "Components: main" \
            "Description: Kilurion custom FreeRDP fork for Linux" \
            > Release

          apt-ftparchive release . >> Release

          gpg --batch --yes --armor --detach-sign -o Release.gpg Release
          gpg --batch --yes --clearsign -o InRelease Release

          cd ../..
          gpg --batch --armor --export > gpg.key

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apt-repo
          force_orphan: true
